name: Yahiko Kernel(CERTUS) ARM64

on:
  workflow_dispatch: # Agar bisa dijalankan manual lewat tombol "Run workflow" di GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [NoKSU, KSU]

    steps:
      - name: Set Build Timestamp (WIB)
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Jakarta' date '+%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python3 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup ccache (${{ matrix.variant }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.variant }}-

      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Clone Toolchain (Proton Clang)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone AnyKernel3-Certus
        run: |
          git clone --depth=1 https://github.com/zexxadev/AnyKernel3-Certus.git AnyKernel3-Certus

      - name: Fix WireGuard Source
        run: |
          if [ ! -f "net/wireguard/Kconfig" ]; then
            rm -rf net/wireguard
            git clone --depth=1 https://git.zx2c4.com/wireguard-linux-compat wireguard-compat
            cp -r wireguard-compat/src net/wireguard
            rm -rf wireguard-compat
          fi
          if [ -f "scripts/fetch-latest-wireguard.sh" ]; then
            printf "#!/bin/sh\nexit 0\n" > scripts/fetch-latest-wireguard.sh
            chmod +x scripts/fetch-latest-wireguard.sh
          fi

      - name: Setup KernelSU
        if: matrix.variant == 'KSU'
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Apply Safe CPU OC Patch (2.15 GHz)
        run: |
          OPP_FILES=$(find drivers/misc/mediatek/base/power/ -name "*cpufreq*opp*.h" -o -name "*cpufreq*platform*.h" 2>/dev/null)
          for f in $OPP_FILES; do
            sed -i 's/2001000/2150000/g' "$f"
            sed -i 's/2000000/2150000/g' "$f"
          done

      - name: Patch Default VM, eMMC & Scheduler Tweaks
        run: |
          # 1. Default vm.swappiness = 130 (dari 60)
          sed -i 's/int vm_swappiness = 60;/int vm_swappiness = 130;/g' mm/vmscan.c

          # 2. Default vm.vfs_cache_pressure = 80 (dari 100)
          sed -i 's/\(sysctl_vfs_cache_pressure[^=]*=\) 100;/\1 80;/g' fs/dcache.c

          # 3. Default vm.page-cluster = 0 (dari 2 atau 3 di swap_setup)
          sed -i 's/page_cluster = [23];/page_cluster = 0;/g' mm/swap.c

          # 4. Default vm.watermark_scale_factor = 30 (dari 10)
          sed -i 's/int watermark_scale_factor = 10;/int watermark_scale_factor = 30;/g' mm/page_alloc.c

          # 5. Default vm.dirty_background_ratio = 5 (dari 10) & vm.dirty_ratio = 15 (dari 20)
          sed -i 's/int dirty_background_ratio = 10;/int dirty_background_ratio = 5;/g' mm/page-writeback.c
          sed -i 's/int vm_dirty_ratio = 20;/int vm_dirty_ratio = 15;/g' mm/page-writeback.c

          # 6. Matikan default MMC SPI CRC check (use_spi_crc = 0)
          find drivers/mmc/core/ -name "*.c" -exec sed -i 's/bool use_spi_crc = 1;/bool use_spi_crc = 0;/g; s/bool use_spi_crc = true;/bool use_spi_crc = false;/g' {} +

          # 7. Matikan GENTLE_FAIR_SLEEPERS secara default untuk respons UI/sentuhan
          sed -i 's/SCHED_FEAT(GENTLE_FAIR_SLEEPERS, true)/SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)/g' kernel/sched/features.h

          # Verifikasi hasil patch di log Actions
          grep -n "vm_swappiness =" mm/vmscan.c
          grep -n "sysctl_vfs_cache_pressure" fs/dcache.c
          grep -n "page_cluster =" mm/swap.c
          grep -n "watermark_scale_factor =" mm/page_alloc.c
          grep -En "(dirty_background_ratio|vm_dirty_ratio) =" mm/page-writeback.c
          grep -rn "use_spi_crc =" drivers/mmc/core/
          grep -n "GENTLE_FAIR_SLEEPERS" kernel/sched/features.h

      - name: Compile Kernel (${{ matrix.variant }})
        run: |
          set -o pipefail
          rm -f $PWD/clang/bin/ld $PWD/clang/bin/ld.lld $PWD/clang/bin/aarch64-linux-gnu-ld
          ln -sf /usr/bin/aarch64-linux-gnu-ld.bfd $PWD/clang/bin/ld.lld
          ln -sf /usr/bin/aarch64-linux-gnu-ld.bfd $PWD/clang/bin/aarch64-linux-gnu-ld

          aarch64-linux-gnu-ld.bfd --version

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          ccache -z

          make O=out ARCH=arm64 certus_defconfig

          # 1. Localversion
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Yahiko-Certus-${{ matrix.variant }}" \
            -d CONFIG_LOCALVERSION_AUTO

          # 2. Memory Management (ZRAM LZ4 & MGLRU)
          scripts/config --file out/.config \
            -e CONFIG_SWAP \
            -e CONFIG_ZSMALLOC \
            -e CONFIG_ZRAM \
            -e CONFIG_CRYPTO_LZ4 \
            -d CONFIG_CRYPTO_LZ4HC \
            -e CONFIG_ZRAM_DEF_COMP_LZ4 \
            -e CONFIG_LRU_GEN \
            -e CONFIG_LRU_GEN_ENABLED

          # 3. CPU Governor & Battery Efficiency (Daily + Light Gaming)
          scripts/config --file out/.config \
            -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            -e CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            -e CONFIG_NO_HZ_IDLE \
            -e CONFIG_HIGH_RES_TIMERS \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_PM_AUTOSLEEP \
            -e CONFIG_PM_WAKELOCKS

          # 4. Network Latency (TCP BBR & FQ Qdisc)
          scripts/config --file out/.config \
            -e CONFIG_NET_SCH_FQ \
            -e CONFIG_NET_SCH_FQ_CODEL \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr"

          # 5. Strip Debug Overhead (Hemat RAM & CPU)
          scripts/config --file out/.config \
            -d CONFIG_SCHED_DEBUG \
            -d CONFIG_FTRACE \
            -d CONFIG_FUNCTION_TRACER \
            -d CONFIG_DEBUG_FS

          # 6. Isolasi Varian NoKSU
          if [ "${{ matrix.variant }}" == "NoKSU" ]; then
            scripts/config --file out/.config -d CONFIG_KSU
          fi

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="gcc -B/usr/bin" \
            LD=aarch64-linux-gnu-ld.bfd \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log

          ccache -s

      - name: Inject Runtime Tweaks & Pack Flashable Zip (${{ matrix.variant }})
        run: |
          ZIP_NAME="Yahiko-Certus-${{ matrix.variant }}-${{ env.BUILD_TIME }}.zip"

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-Certus/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3-Certus/
          else
            echo "Kernel Image tidak ditemukan!"
            exit 1
          fi

          # Buat init.yahiko.rc di overlay.d AnyKernel3
          mkdir -p AnyKernel3-Certus/overlay.d
          cat << 'EOF' > AnyKernel3-Certus/overlay.d/init.yahiko.rc
          on property:sys.boot_completed=1
              # MGLRU Tuning
              write /sys/kernel/mm/lru_gen/enabled 7
              write /sys/kernel/mm/lru_gen/min_ttl_ms 1000

              # VM Sysctl Tuning (RAM 2GB)
              write /proc/sys/vm/swappiness 130
              write /proc/sys/vm/page-cluster 0
              write /proc/sys/vm/vfs_cache_pressure 80
              write /proc/sys/vm/watermark_scale_factor 30
              write /proc/sys/vm/watermark_boost_factor 0
              write /proc/sys/vm/dirty_background_ratio 5
              write /proc/sys/vm/dirty_ratio 15
              write /proc/sys/vm/stat_interval 10
              write /proc/sys/vm/min_free_kbytes 16384

              # Network TCP BBR & FQ
              write /proc/sys/net/core/default_qdisc fq
              write /proc/sys/net/ipv4/tcp_congestion_control bbr

              # eMMC 5.1 I/O & CRC Optimization
              write /sys/module/mmc_core/parameters/use_spi_crc 0
              write /sys/block/mmcblk0/queue/iostats 0
              write /sys/block/mmcblk0/queue/read_ahead_kb 128
              write /sys/block/mmcblk0/queue/nr_requests 64

              # UI & Touch Responsiveness (Disable Gentle Fair Sleepers)
              write /sys/kernel/debug/sched_features NO_GENTLE_FAIR_SLEEPERS

              # ZRAM 1.5GB LZ4
              exec - root root -- /system/bin/sh -c "swapoff /dev/block/zram0; echo 1 > /sys/block/zram0/reset; echo lz4 > /sys/block/zram0/comp_algorithm; echo 4 > /sys/block/zram0/max_comp_streams; echo 1610612736 > /sys/block/zram0/disksize; mkswap /dev/block/zram0; swapon /dev/block/zram0 -p 32758"
          EOF
          chmod 0750 AnyKernel3-Certus/overlay.d/init.yahiko.rc

          # Sesuaikan kernel.string, target block, dan konfigurasi anykernel.sh
          sed -i "s|kernel.string=.*|kernel.string=Yahiko Kernel (${{ matrix.variant }}) by zexxadev;|g" AnyKernel3-Certus/anykernel.sh
          sed -i "s|do.devicecheck=.*|do.devicecheck=0|g" AnyKernel3-Certus/anykernel.sh
          sed -i "s|block=.*|block=/dev/block/platform/bootdevice/by-name/boot;|g" AnyKernel3-Certus/anykernel.sh
          sed -i "s|is_slot_device=.*|is_slot_device=0;|g" AnyKernel3-Certus/anykernel.sh

          # Verifikasi dukungan overlay.d & hasil konfigurasi anykernel.sh
          grep -q "write_boot" AnyKernel3-Certus/anykernel.sh || echo "WARNING: anykernel.sh tidak memakai write_boot!"
          grep -q "overlay.d" AnyKernel3-Certus/tools/ak3-core.sh || echo "WARNING: ak3-core.sh belum mendukung overlay.d!"
          grep -E "^(kernel\.string|do\.devicecheck|block|is_slot_device)=" AnyKernel3-Certus/anykernel.sh

          cd AnyKernel3-Certus
          zip -r9 "../${ZIP_NAME}" . -x ".git*" "README.md" "*placeholder"
          cd ..

          unzip -l "${ZIP_NAME}"

      - name: Send Flashable Zip to Telegram (${{ matrix.variant }})
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          TG_ID: ${{ secrets.TG_ID }}
        run: |
          ZIP_FILE="Yahiko-Certus-${{ matrix.variant }}-${{ env.BUILD_TIME }}.zip"
          MD5=$(md5sum "${ZIP_FILE}" | awk '{print $1}')

          curl -F document=@"${ZIP_FILE}" \
            -F "chat_id=${TG_ID}" \
            -F "parse_mode=Markdown" \
            -F "caption=\`${MD5}\`" \
            "https://api.telegram.org/bot${TG_BOT}/sendDocument"

      - name: Send Error Log to Telegram (${{ matrix.variant }})
        if: failure()
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          TG_ID: ${{ secrets.TG_ID }}
        run: |
          if [ -f build.log ]; then
            curl -F document=@"build.log" \
              -F "chat_id=${TG_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=❌ Build *Yahiko-Certus (${{ matrix.variant }})* gagal." \
              "https://api.telegram.org/bot${TG_BOT}/sendDocument"
          else
            curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_ID}" \
              -d "parse_mode=Markdown" \
              -d "text=❌ Build *Yahiko-Certus (${{ matrix.variant }})* gagal sebelum tahap kompilasi."
          fi

      - name: Upload Kernel Zip (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: Yahiko-Certus-${{ matrix.variant }}-${{ env.BUILD_TIME }}
          path: Yahiko-Certus-${{ matrix.variant }}-${{ env.BUILD_TIME }}.zip